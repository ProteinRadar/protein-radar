name: Daily ProteinTrack
on:
  schedule:
    - cron: '0 5 * * *' # 06:00 winter / 07:00 summer in Italy
  workflow_dispatch:
  # Temporary integration test on script/workflow updates
  push:
    branches: [main]
    paths:
      - 'scripts/daily_protein_track.py'
      - '.github/workflows/daily-protein-track.yml'

permissions:
  contents: read
  id-token: write

jobs:
  record-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROTEIN_SHEET_ID: ${{ secrets.PROTEIN_SHEET_ID }}
      WIF_PROVIDER: ${{ secrets.PROTEIN_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.PROTEIN_GOOGLE_SERVICE_ACCOUNT }}
    steps:
      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$PROTEIN_SHEET_ID" || -z "$WIF_PROVIDER" || -z "$WIF_SERVICE_ACCOUNT" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Missing keyless Google authentication settings; see docs/daily-protein-track.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'
      - name: Authenticate Google (no JSON key)
        uses: google-github-actions/auth@v3
        if: steps.config.outputs.configured == 'true'
        with:
          workload_identity_provider: ${{ secrets.PROTEIN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.PROTEIN_GOOGLE_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - uses: actions/setup-python@v5
        if: steps.config.outputs.configured == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-price-tracker.txt
      - name: Install dependencies and Chromium
        if: steps.config.outputs.configured == 'true'
        run: |
          python -m pip install -r requirements-price-tracker.txt
          python -m playwright install --with-deps chromium
      - name: Check prices and update Google Sheet
        if: steps.config.outputs.configured == 'true'
        run: python scripts/daily_protein_track.py --write
      - name: Upload failed-product diagnostics
        if: always() && steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: product-page-diagnostics
          path: artifacts/diagnostics/
          if-no-files-found: ignore
          retention-days: 3
